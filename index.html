<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title><TMPNAME> – TMP‑Raum · iki1uc</title>

<style>
body { background:#000; color:#0f0; font-family:monospace; padding:40px; }
.block { background:#111; border:1px solid #333; padding:25px; margin-bottom:30px; border-radius:8px; }
.title { font-size:22px; color:#6cf; margin-bottom:10px; }
pre { background:#000; border-left:3px solid #6cf; padding:15px; white-space:pre-wrap; }
</style>

<script type="module">
import { TMP_CORE } from "./TMP.core.js";
import { TMP_DASH } from "./TMP_DASH.js";
import { ID_TMP } from "./ID_TMP.js";

(async function(){

    const tmp = TMP_CORE();
    const dash = TMP_DASH(tmp);
    const id = ID_TMP(tmp);

    document.getElementById("tmp-core").innerText =
        JSON.stringify(tmp, null, 2);

    document.getElementById("tmp-dash").innerText =
        JSON.stringify(dash, null, 2);

    document.getElementById("tmp-id").innerText =
        JSON.stringify(id, null, 2);

})();
</script>

</head>

<body>

<h1><TMPNAME> – TMP‑Raum</h1>

<div class="block">
    <div class="title">TMP‑Core</div>
    <pre id="tmp-core"></pre>
</div>

<div class="block">
    <div class="title">TMP‑Dashboard</div>
    <pre id="tmp-dash"></pre>
</div>

<div class="block">
    <div class="title">TMP‑Identität</div>
    <pre id="tmp-id"></pre>
</div>

</body>
</html>
